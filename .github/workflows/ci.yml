name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_15.4.app/Contents/Developer'
    - name: Build for iOS
      run: swift build --triple arm64-apple-ios-simulator
    - name: Run tests
      run: swift test --triple arm64-apple-ios-simulator