name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build for iOS (iOS 16.0+)
      run: |
        xcodebuild -scheme DateRangePicker -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.0' build
    - name: Run tests (iOS 16.0+)
      run: |
        xcodebuild -scheme DateRangePicker -destination 'platform=iOS Simulator,name=iPhone 14,OS=16.0' test