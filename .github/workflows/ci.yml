name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Pick available iPhone simulator
      run: |
        # pick the first "iPhone" device in the "available" list
        UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-F0-9-]{36}")
        if [ -z "$UDID" ]; then
          echo "No iPhone simulator found" >&2
          exit 1
        fi
        echo "SIM_UDID=$UDID" >> $GITHUB_ENV

    - name: Build for iOS (simulator)
      run: |
        xcodebuild -scheme DateRangePicker -destination "id=$SIM_UDID" -derivedDataPath "${{ runner.temp }}/derived_data" clean build

    - name: Run tests (simulator)
      run: |
        xcodebuild -scheme DateRangePicker -destination "id=$SIM_UDID" -derivedDataPath "${{ runner.temp }}/derived_data" test